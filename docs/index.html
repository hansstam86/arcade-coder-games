<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Coder Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #14161c; color: #9aa3b2; font-family: system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: #1b1d24; border-bottom: 1px solid #262a34;
  }
  header h1 { font-size: 15px; font-weight: 600; color: #d5dae4; margin: 0 8px 0 0; }
  header .spacer { flex: 1; }
  button, select {
    padding: 6px 14px; border: 1px solid #3a3f4c; border-radius: 8px;
    background: #1d2027; color: #c6cdd9; font: 500 13px system-ui; cursor: pointer;
  }
  button:hover { background: #262b35; }
  button:disabled { opacity: .4; cursor: default; }
  #run { background: #1d4a2b; border-color: #2c6e40; color: #b7eec6; }
  #run:hover { background: #235934; }
  #board { background: #1d2b4a; border-color: #2c4a6e; color: #b7d4ee; }
  #board:hover { background: #233a59; }
  a.repo { color: #7a86ff; font-size: 13px; text-decoration: none; }
  main { flex: 1; display: flex; min-height: 0; }
  .left { flex: 1.2; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #262a34; }
  .CodeMirror { flex: 1; height: auto; font-size: 13px; }
  .right { flex: 1; display: flex; flex-direction: column; align-items: center; overflow: auto; padding: 18px; gap: 14px; }
  .device { background: #e8e4dc; border-radius: 22px; padding: 20px 20px 30px; box-shadow: 0 14px 44px rgba(0,0,0,.5); }
  .grid { display: grid; grid-template-columns: repeat(12, 26px); gap: 5px; background: #1b1d24; padding: 12px; border-radius: 12px; }
  .pad { width: 26px; height: 26px; border: 0; border-radius: 6px; background: #000; cursor: pointer; transition: transform .05s; box-shadow: inset 0 0 4px rgba(0,0,0,.6); }
  .pad:active { transform: scale(.85); }
  .home { margin: 16px auto 0; width: 38px; height: 10px; border-radius: 5px; background: #c9c4ba; }
  #console {
    width: 100%; max-width: 460px; flex: 1; min-height: 90px; overflow: auto;
    background: #101218; border: 1px solid #262a34; border-radius: 10px;
    padding: 10px 12px; font: 12px ui-monospace, monospace; white-space: pre-wrap;
  }
  #console .err { color: #ff8080; }
  #status { font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<header>
  <h1>Arcade Coder Studio</h1>
  <select id="examples">
    <option value="">examples…</option>
    <option value="chase.py">chase (minimal)</option>
    <option value="snake.py">snake (real-time)</option>
    <option value="full_arcade.py">full arcade (10 games)</option>
  </select>
  <button id="run" disabled>&#9654; Run</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <button id="reset" disabled>&#x27F2; Reset</button>
  <button id="board" disabled title="drive a real Arcade Coder over Web Bluetooth (Chrome/Edge)">&#9889; Run on board</button>
  <span id="status">loading Python…</span>
  <div class="spacer"></div>
  <a class="repo" href="arcadeos.html">arcade os</a>
  <a class="repo" href="deck.html">deck editor</a>
  <a class="repo" href="kopads.html">ko-pads</a>
  <a class="repo" href="https://github.com/hansstam86/arcade-coder-games">github repo &nearr;</a>
</header>
<main>
  <div class="left"><textarea id="code"></textarea></div>
  <div class="right">
    <div class="device">
      <div class="grid" id="grid"></div>
      <div class="home"></div>
    </div>
    <div id="console"></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const FILES = [
  "py/arcadecoder/__init__.py",
  "py/arcadecoder/runner.py",
  "py/arcadecoder/protocol.py",
  "py/arcade.py",
  "py/minesweeper.py",
  "py/whackamole.py",
];
const grid = document.getElementById("grid");
const pads = [];
for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
  const b = document.createElement("button");
  b.className = "pad";
  b.addEventListener("click", () => press(x, y));
  grid.appendChild(b); pads.push(b);
}
const consoleEl = document.getElementById("console");
function say(text, err = false) {
  const s = document.createElement("span");
  if (err) s.className = "err";
  s.textContent = text + "\n";
  consoleEl.appendChild(s);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
const editor = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "python", theme: "material-darker", lineNumbers: true, indentUnit: 4,
});
const runBtn = document.getElementById("run");
const stopBtn = document.getElementById("stop");
const resetBtn = document.getElementById("reset");
const statusEl = document.getElementById("status");

let pyodide = null, timer = null, running = false;

async function boot() {
  pyodide = await loadPyodide();
  pyodide.setStdout({ batched: (t) => say(t) });
  pyodide.setStderr({ batched: (t) => say(t, true) });
  for (const f of FILES) {
    const text = await (await fetch(f)).text();
    const path = "/" + f;
    pyodide.FS.mkdirTree(path.slice(0, path.lastIndexOf("/")));
    pyodide.FS.writeFile(path, text);
  }
  pyodide.runPython(`
import sys
sys.path.insert(0, '/py')
import arcadecoder
_captured = {}
def _capture_run(cls, backend=None):
    _captured['cls'] = cls
arcadecoder.run = _capture_run

from arcadecoder import protocol as _proto
import json as _json
_board_frames = []
_board_last = None

def _board_start_hex():
    return _proto.cmd_start_builtin('paint').hex()

def _board_frame_hex():
    global _board_last
    fb = _loop.frame_device_bytes()
    if fb == _board_last:
        return ''
    _board_last = fb
    _board_frames.append(fb)
    del _board_frames[:-4]
    return _proto.cmd_paint_frame(fb).hex()

def _board_presses(h):
    canvas = _proto.extract_canvas(bytes.fromhex(h))
    if canvas is None:
        return '[]'
    best = None
    for fb in reversed(_board_frames):
        changed = [i for i in range(144) if canvas[i*3:i*3+3] != fb[i*3:i*3+3]]
        if best is None or len(changed) < len(best):
            best = changed
    if not best or len(best) > 4:
        return '[]'
    return _json.dumps([i for i in best if canvas[i*3:i*3+3] == _proto.BRUSH])

def _board_reset_last():
    global _board_last
    _board_last = None
`);
  statusEl.textContent = "ready — pick an example or write a game, then Run";
  runBtn.disabled = false;
  if ("bluetooth" in navigator) boardBtn.disabled = false;
  else boardBtn.title = "Web Bluetooth needs Chrome or Edge";
  const ex = await (await fetch("py/examples/chase.py")).text();
  editor.setValue(ex);
}

function paint(hex) {
  for (let i = 0; i < 144; i++) {
    pads[i].style.background = hex[i];
    pads[i].style.boxShadow = hex[i] === "#000000"
      ? "inset 0 0 4px rgba(0,0,0,.6)" : `0 0 8px ${hex[i]}`;
  }
}

function press(x, y) {
  if (running) try { pyodide.runPython(`_loop.press(${x}, ${y})`); } catch (e) { say(String(e), true); }
}

function stop() {
  if (timer) clearInterval(timer);
  timer = null; running = false;
  stopBtn.disabled = resetBtn.disabled = true;
  try { if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect(); } catch (e) {}
  bleDevice = null; cmdChar = null;
  statusEl.textContent = "stopped";
}

function prepare() {
  pyodide.runPython("_captured.clear()");
  pyodide.globals.set("__name__", "__main__");
  pyodide.runPython(editor.getValue());
  if (!pyodide.runPython("'cls' in _captured")) {
    say("your game never called run(YourGame) — add it at the end", true);
    return false;
  }
  pyodide.runPython("from arcadecoder.runner import GameLoop\n_loop = GameLoop(_captured['cls'])\n_board_reset_last()");
  return true;
}

runBtn.addEventListener("click", () => {
  stop();
  consoleEl.textContent = "";
  try {
    if (!prepare()) return;
    const fps = pyodide.runPython("getattr(_captured['cls'], 'fps', 10)");
    running = true;
    stopBtn.disabled = resetBtn.disabled = false;
    statusEl.textContent = "running — click pads to press them";
    timer = setInterval(() => {
      try {
        const proxy = pyodide.runPython("_loop.tick()");
        paint(proxy.toJs()); proxy.destroy();
      } catch (e) { say(String(e), true); stop(); }
    }, Math.max(40, 1000 / fps));
  } catch (e) { say(String(e), true); }
});

// ---- Web Bluetooth: drive a real board from the page -----------------------
const boardBtn = document.getElementById("board");
let bleDevice = null, cmdChar = null, boardBusy = false;
const hexToBytes = (h) => Uint8Array.from(h.match(/../g) || [], (b) => parseInt(b, 16));

async function connectBoard() {
  const SERVICE = "778d5426-fa29-4363-91fd-a9f5cfcfce85";
  const CMD = "e18d056b-7dae-49c1-b5f2-17684801e446";
  const CB = "21acb4a0-24d0-42f4-8e61-c827daf68d12";
  bleDevice = await navigator.bluetooth.requestDevice({
    filters: [{ services: [SERVICE] }, { namePrefix: "Gamer" }],
    optionalServices: [SERVICE],
  });
  bleDevice.addEventListener("gattserverdisconnected", () => { say("board disconnected", true); stop(); });
  const server = await bleDevice.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  cmdChar = await svc.getCharacteristic(CMD);
  const cbChar = await svc.getCharacteristic(CB);
  await cbChar.startNotifications();
  cbChar.addEventListener("characteristicvaluechanged", (e) => {
    const dv = e.target.value;
    let h = "";
    for (let i = 0; i < dv.byteLength; i++) h += dv.getUint8(i).toString(16).padStart(2, "0");
    try {
      const hits = JSON.parse(pyodide.runPython(`_board_presses('${h}')`));
      if (hits.length) {
        for (const i of hits) pyodide.runPython(`_loop.press(${i % 12}, ${Math.floor(i / 12)})`);
        pyodide.runPython("_board_reset_last()");  // repaint over the brush pixel
      }
    } catch (err) { say(String(err), true); }
  });
  await cmdChar.writeValueWithResponse(hexToBytes(pyodide.runPython("_board_start_hex()")));
  await new Promise((r) => setTimeout(r, 800));
}

boardBtn.addEventListener("click", async () => {
  stop();
  consoleEl.textContent = "";
  try {
    if (!prepare()) return;
    statusEl.textContent = "connecting to board\u2026 (pick it in the chooser)";
    await connectBoard();
    running = true;
    stopBtn.disabled = resetBtn.disabled = false;
    statusEl.textContent = "running on board \u2014 physical pads are live";
    timer = setInterval(async () => {
      try {
        const proxy = pyodide.runPython("_loop.tick()");
        paint(proxy.toJs()); proxy.destroy();
        if (boardBusy || !cmdChar) return;
        const cmdHex = pyodide.runPython("_board_frame_hex()");
        if (cmdHex) {
          boardBusy = true;
          try { await cmdChar.writeValueWithResponse(hexToBytes(cmdHex)); }
          finally { boardBusy = false; }
        }
      } catch (e) { say(String(e), true); stop(); }
    }, 220);  // pace writes: faster streams drop the ESP32 connection
  } catch (e) {
    say(String(e), true);
    statusEl.textContent = "board connection failed";
  }
});
stopBtn.addEventListener("click", stop);
resetBtn.addEventListener("click", () => {
  if (running) try { pyodide.runPython("_loop.reset()\n_board_reset_last()"); } catch (e) { say(String(e), true); }
});
document.getElementById("examples").addEventListener("change", async (e) => {
  if (!e.target.value) return;
  editor.setValue(await (await fetch("py/examples/" + e.target.value)).text());
});
boot().catch((e) => { statusEl.textContent = "failed to load"; say(String(e), true); });
</script>
</body>
</html>
