<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Coder Emulator</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #14161c; font-family: system-ui, sans-serif; color: #9aa3b2;
  }
  .device {
    background: #e8e4dc; border-radius: 28px; padding: 26px 26px 40px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }
  .grid {
    display: grid; grid-template-columns: repeat(12, 34px); gap: 6px;
    background: #1b1d24; padding: 16px; border-radius: 14px;
  }
  .pad {
    width: 34px; height: 34px; border: 0; border-radius: 7px;
    background: #000; cursor: pointer; transition: transform .05s;
    box-shadow: inset 0 0 4px rgba(0,0,0,.6);
  }
  .pad:active { transform: scale(.88); }
  .home {
    margin: 22px auto 0; width: 46px; height: 12px; border-radius: 6px;
    background: #c9c4ba;
  }
  .reset {
    display: block; margin: 14px auto 0; padding: 6px 18px;
    border: 1px solid #3a3f4c; border-radius: 8px; background: #1d2027;
    color: #9aa3b2; font: 500 12px system-ui, sans-serif; cursor: pointer;
  }
  .reset:hover { background: #262b35; color: #d5dae4; }
  .reset:active { transform: scale(.96); }
  h1 { font-size: 14px; font-weight: 500; text-align: center; margin: 18px 0 0; }
  .hint { font-size: 12px; text-align: center; margin-top: 6px; opacity: .7; }
</style>
</head>
<body>
<div>
  <div class="device">
    <div class="grid" id="grid"></div>
    <div class="home"></div>
  </div>
  <h1>Arcade Coder Emulator</h1>
  <div class="hint">click pads to press them &middot; R = reset</div>
  <button class="reset" id="reset" title="restart the game (like power-cycling the board)">&#x27F2; reset</button>
</div>
<script>
  const grid = document.getElementById("grid");
  const pads = [];
  for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
    const b = document.createElement("button");
    b.className = "pad";
    b.addEventListener("click", () => fetch(`/press?x=${x}&y=${y}`));
    grid.appendChild(b); pads.push(b);
  }
  const reset = () => fetch("/reset");
  document.getElementById("reset").addEventListener("click", reset);
  document.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") reset();
  });
  const es = new EventSource("/events");
  es.onmessage = (e) => {
    const px = JSON.parse(e.data);
    for (let i = 0; i < 144; i++) {
      pads[i].style.background = px[i];
      pads[i].style.boxShadow = px[i] === "#000000"
        ? "inset 0 0 4px rgba(0,0,0,.6)" : `0 0 10px ${px[i]}`;
    }
  };
</script>
</body>
</html>
