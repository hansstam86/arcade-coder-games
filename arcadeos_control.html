<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Coder — Control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0d0f14; color:#e8ecf2; padding:22px;
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:#8b94a3; margin:0 0 20px; font-size:13px; }
  .status { display:inline-block; font-size:12.5px; color:#8b94a3; margin-left:8px; }
  .status b { color:#6ee7a0; }
  .panel { background:#151922; border:1px solid #232a37; border-radius:14px; padding:18px; margin-bottom:18px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:#8b94a3; margin:0 0 14px; }
  input[type=text] { width:100%; background:#0e1219; border:1px solid #313b4d; border-radius:9px;
    color:#e8ecf2; padding:10px 12px; font:600 16px system-ui; letter-spacing:.5px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; }
  label { font-size:13px; color:#aeb7c6; display:flex; align-items:center; gap:6px; }
  button { font:600 13px system-ui; color:#e8ecf2; background:#202838; border:1px solid #313b4d;
    border-radius:9px; padding:9px 16px; cursor:pointer; }
  button:hover { background:#273143; }
  button.go { background:#1d4a2b; border-color:#2c6e40; color:#b7eec6; }
  input[type=range] { flex:1; min-width:120px; }
  input[type=color] { width:34px; height:30px; border:none; background:none; padding:0; cursor:pointer; }
  .apps { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .app { background:#1b2130; border:1px solid #2c3444; border-radius:10px; padding:9px 4px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px; }
  .app:hover { background:#232c3d; }
  .app.on { border-color:#4f8cff; }
  .ico { width:24px; height:24px; border-radius:6px; overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .ico span { display:block; }
  .app .nm { font-size:11px; color:#cfd6e2; }
  .draw { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(12,1fr);
    width:min(92vw,360px); aspect-ratio:1; gap:2px; background:#0b0d12; padding:8px; border-radius:12px;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  .px { border-radius:3px; background:#000; }
  .pal { display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; max-width:min(92vw,360px); }
  .sw { width:34px; height:34px; border-radius:8px; border:2px solid transparent; cursor:pointer; }
  .sw.on { border-color:#fff; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#1d4a2b; color:#b7eec6; padding:8px 16px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  a { color:#7a86ff; text-decoration:none; }
  /* phone-optimized */
  @media (max-width:640px) {
    body { padding:14px; }
    h1 { font-size:20px; }
    .panel { padding:16px 14px; border-radius:16px; }
    input[type=text] { font-size:17px; padding:13px 14px; }
    button { padding:13px 18px; font-size:15px; }
    #send { flex:1; min-width:120px; }
    .apps { grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; }
    .app { padding:12px 4px; }
    .ico { width:30px; height:30px; }
    .app .nm { font-size:12px; }
    .sw { width:40px; height:40px; }
    .row { gap:14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🕹️ Arcade Coder Control <span class="status" id="status">…</span></h1>
  <p class="sub">Send messages, launch apps, and draw on the board — live. <a href="/">dashboard</a> · <a href="apps.html">organize apps</a></p>

  <div class="panel">
    <h2>Send a message</h2>
    <input type="text" id="msg" placeholder="TYPE A MESSAGE…" maxlength="120" autocomplete="off">
    <div class="row">
      <label><input type="checkbox" id="rainbow" checked> rainbow</label>
      <input type="color" id="mcolor" value="#00c8ff" title="message colour (when rainbow is off)">
      <label>speed <input type="range" id="speed" min="2" max="14" value="7"></label>
      <button class="go" id="send">Send →</button>
    </div>
  </div>

  <div class="panel">
    <h2>Launch an app</h2>
    <div class="apps" id="apps"></div>
  </div>

  <div class="panel">
    <h2>Draw on the board</h2>
    <div class="draw">
      <div class="grid" id="grid"></div>
      <div class="pal" id="pal"></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="live" checked> live (paint straight onto the board)</label>
      <button id="paint">Send to board</button>
      <button id="clear">Clear</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PAL = ["#000000","#ff1e1e","#00dc3c","#005aff","#ffdc00","#ff7800","#00dcdc",
             "#ff0096","#9600ff","#ffffff","#ff78b4","#96501e","#6e6e78"];
let cur = "#ffffff", painting = false;
const grid = document.getElementById("grid"), cells = [];
const pixels = Array(144).fill("#000000");

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1400); }

async function post(path, body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  return r.ok;
}

// ---- message ----
document.getElementById("send").onclick = async () => {
  const text = document.getElementById("msg").value.trim();
  if(!text){ toast("type something first"); return; }
  const body = { text, speed: +document.getElementById("speed").value };
  if(document.getElementById("rainbow").checked) body.rainbow = true;
  else { const c=document.getElementById("mcolor").value; body.rainbow=false;
    body.color=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
  toast(await post("/say", body) ? "sent to the board ✓" : "failed");
};
document.getElementById("msg").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("send").click(); });

// ---- apps ----
async function loadApps(){
  const d = await (await fetch("/apps")).json();
  const el = document.getElementById("apps"); el.innerHTML="";
  const home = document.createElement("div"); home.className="app";
  home.innerHTML = '<div class="ico" style="background:#333"></div><div class="nm">home</div>';
  home.onclick = ()=>launch("home"); el.appendChild(home);
  d.registry.forEach(a=>{
    const t=document.createElement("div"); t.className="app"; t.dataset.name=a.name;
    const ico=document.createElement("div"); ico.className="ico";
    a.icon.forEach(c=>{const s=document.createElement("span"); s.style.background=c; ico.appendChild(s);});
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=a.name;
    t.appendChild(ico); t.appendChild(nm); t.onclick=()=>launch(a.name); el.appendChild(t);
  });
}
async function launch(name){ toast(await post("/switch",{app:name}) ? "launched "+name : "failed"); }

// ---- status ----
async function poll(){
  try{ const s=await (await fetch("/status")).json();
    document.getElementById("status").innerHTML = "showing <b>"+s.app+"</b>";
    document.querySelectorAll(".app").forEach(a=>a.classList.toggle("on", a.dataset.name===s.app));
  }catch(e){ document.getElementById("status").textContent="board offline"; }
}

// ---- draw ----
PAL.forEach((c,i)=>{ const s=document.createElement("div"); s.className="sw"+(c===cur?" on":"");
  s.style.background=c; s.onclick=()=>{cur=c; document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on")); s.classList.add("on");};
  document.getElementById("pal").appendChild(s); });
for(let i=0;i<144;i++){ const c=document.createElement("div"); c.className="px"; c.dataset.i=i;
  const put=()=>{ pixels[i]=cur; c.style.background=cur; scheduleLive(); };
  c.addEventListener("mousedown",()=>{painting=true;put();});
  c.addEventListener("mouseenter",()=>{if(painting)put();});
  grid.appendChild(c); cells.push(c); }
window.addEventListener("mouseup",()=>painting=false);
// touch support (iPhone/iPad)
function paintAt(cx,cy){ const el=document.elementFromPoint(cx,cy);
  if(el&&el.classList.contains("px")){ const i=+el.dataset.i; pixels[i]=cur; el.style.background=cur; scheduleLive(); } }
grid.addEventListener("touchstart",e=>{e.preventDefault();const t=e.touches[0];paintAt(t.clientX,t.clientY);},{passive:false});
grid.addEventListener("touchmove",e=>{e.preventDefault();const t=e.touches[0];paintAt(t.clientX,t.clientY);},{passive:false});
function toRGB(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
function sendPixels(){ post("/paint",{pixels:pixels.map(toRGB)}); }
let liveT=null;
function scheduleLive(){ if(!document.getElementById("live").checked) return;
  clearTimeout(liveT); liveT=setTimeout(sendPixels,140); }
document.getElementById("paint").onclick=()=>{ sendPixels(); toast("painted ✓"); };
document.getElementById("clear").onclick=()=>{ for(let i=0;i<144;i++){pixels[i]="#000000"; cells[i].style.background="#000";}
  if(document.getElementById("live").checked) sendPixels(); };

loadApps(); poll(); setInterval(poll, 2500);
</script>
</body>
</html>
